version: "3.9"

services:
  frontend:
    build:
      context: ./social-media
      # target: dev
      target: dev
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    ports:
      - "3000:3000"
    volumes:
      - ./social-media:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      PORT: 3000
    depends_on:
      - backend

  backend:
    build:
      context: ./social-media-be
      # target: dev
      target: dev
    ports:
      - "3001:3001"
    volumes:
      - ./social-media-be:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      PORT: 3001
