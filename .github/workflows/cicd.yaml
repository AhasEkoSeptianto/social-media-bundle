name: Nodejs CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Nodejs ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: social-media/package-lock.json

      # front end
      - run: |
          cd social-media
          npm ci
          npm run build --if-present
          npm test

  build-backend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Nodejs ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: social-media-be/package-lock.json

      - run: |
          cd social-media-be
          npm ci
          npm test

  docker:
    needs:
      - build-frontend
      - build-backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME  }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./social-media
          file: ./social-media/Dockerfile
          target: production
          push: true
          tags: ekozzi2/social-media-prism-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./social-media-be
          file: ./social-media-be/Dockerfile
          target: production
          push: true
          tags: |
            ekozzi2/social-media-prism-backend:latest

  deploy:
    needs:
      - build-frontend
      - build-backend
      - docker
    runs-on: ubuntu-latest

    steps:
      - name: Debug
        run: |
          echo "${#NETLIFY_DEPLOY_HOOK}"
          echo "${#RENDER_DEPLOY_HOOK}"
        env:
          NETLIFY_DEPLOY_HOOK: ${{ secrets.NETLIFY_DEPLOY_HOOK }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      - name: Trigger Netlify Deploy
        run: curl -X POST "$NETLIFY_DEPLOY_HOOK"
        env:
          NETLIFY_DEPLOY_HOOK: ${{ secrets.NETLIFY_DEPLOY_HOOK }}
      - name: Trigger Render Deploy
        run: curl -X GET "$RENDER_DEPLOY_HOOK"
        env:
          NETLIFY_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
